<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkoutLock — Training Ledger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-logo">
        <span class="logo-icon">&#9965;</span>
        <div>
          <h1 class="logo-title">WorkoutLock</h1>
          <p class="logo-subtitle">Personal Training Ledger</p>
        </div>
      </div>
      <nav class="header-nav">
        <button class="nav-btn active" data-view="split">Weekly Split</button>
        <button class="nav-btn" data-view="prs">PR Board</button>
      </nav>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="main-container">

    <!-- ====== SPLIT VIEW ====== -->
    <section id="view-split" class="view active">

      <div class="section-header">
        <h2 class="section-title">Weekly Training Split</h2>
        <span class="stamp">4-WEEK PROGRAM</span>
      </div>

      <div class="days-grid" id="days-grid">
        <!-- Day cards injected here -->
      </div>

      <!-- Empty state (fallback) -->
      <div class="empty-state" id="split-empty" style="display:none;">
        <p class="empty-icon">&#128221;</p>
        <p class="empty-text">Program not loaded.</p>
      </div>

    </section>

    <!-- ====== PR BOARD VIEW ====== -->
    <section id="view-prs" class="view">

      <div class="section-header">
        <h2 class="section-title">Personal Records</h2>
        <span class="stamp">OFFICIAL LOG</span>
      </div>

      <div class="pr-board" id="pr-board">
        <!-- PR rows injected here -->
      </div>

      <div class="empty-state" id="pr-empty">
        <p class="empty-icon">&#127942;</p>
        <p class="empty-text">No PRs recorded yet.<br>Log a lift to start tracking records.</p>
      </div>

    </section>

  </main>

  <!-- ===== MODALS ===== -->

  <!-- Log Set Modal -->
  <div class="modal-overlay" id="modal-logset">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 class="modal-title" id="logset-title">Log Set</h3>
        <button class="modal-close" data-close="modal-logset">&times;</button>
      </div>
      <div class="modal-body">
        <div class="log-row">
          <div class="log-field">
            <label class="form-label">Weight (lbs)</label>
            <input class="form-input" type="number" id="logset-weight" min="0" step="2.5" />
          </div>
          <div class="log-field">
            <label class="form-label">Reps</label>
            <input class="form-input" type="number" id="logset-reps" min="1" max="999" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" data-close="modal-logset">Cancel</button>
        <button class="btn-primary" id="save-logset-btn">Log Set</button>
      </div>
    </div>
  </div>

  <!-- PR Toast -->
  <div class="pr-toast" id="pr-toast">
    <span class="pr-toast-icon">&#127942;</span>
    <span class="pr-toast-msg" id="pr-toast-msg">New PR!</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
