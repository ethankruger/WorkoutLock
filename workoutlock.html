<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkoutLock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0f14;
      --bg-card:     #161923;
      --bg-card-alt: #1c2130;
      --border:      #252d3e;
      --border-bright: #2e3a52;

      --text:        #e8eaf0;
      --text-muted:  #7a8499;
      --text-dim:    #3d4659;

      --accent:      #4f8ef7;
      --accent-glow: rgba(79, 142, 247, 0.18);
      --accent-dim:  #2a5db5;
      --green:       #22c55e;
      --green-glow:  rgba(34, 197, 94, 0.15);
      --red:         #ef4444;
      --orange:      #f97316;

      --font-head: 'Bebas Neue', 'Arial Black', sans-serif;
      --font-body: 'Space Grotesk', system-ui, sans-serif;

      --radius-sm: 6px;
      --radius:    10px;
      --radius-lg: 14px;

      --shadow-card: 0 2px 12px rgba(0,0,0,0.4), 0 0 0 1px var(--border);
    }

    html { font-size: 16px; }

    body {
      background-color: var(--bg);
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .site-header {
      background: rgba(13,15,20,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .header-logo { display: flex; align-items: center; gap: 0.6rem; }
    .logo-icon { font-size: 1.5rem; line-height: 1; }
    .logo-title {
      font-family: var(--font-head);
      font-size: 1.7rem;
      color: var(--text);
      letter-spacing: 0.1em;
      line-height: 1;
    }
    .logo-title span { color: var(--accent); }
    .logo-subtitle {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
      margin-top: 1px;
    }

    /* Nav */
    .header-nav {
      display: flex;
      gap: 0.35rem;
      background: var(--bg-card);
      padding: 0.3rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .nav-btn {
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.4rem 1rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.15s;
      text-transform: uppercase;
    }
    .nav-btn:hover { color: var(--text); background: var(--bg-card-alt); }
    .nav-btn.active { color: var(--accent); background: var(--accent-glow); }

    /* Main */
    .main-container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.25rem 4rem;
    }
    .view { display: none; }
    .view.active { display: block; }

    /* Section Header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .section-title {
      font-family: var(--font-head);
      font-size: 2rem;
      color: var(--text);
      letter-spacing: 0.08em;
    }
    .stamp {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid var(--accent-dim);
      padding: 0.25rem 0.7rem;
      border-radius: 100px;
      text-transform: uppercase;
    }

    /* Days Grid */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    /* Day Card */
    .day-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .day-card:hover { border-color: var(--border-bright); }

    .day-card-header {
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card-alt);
    }
    .day-card-title-group { flex: 1; min-width: 0; }
    .day-weekday {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1px;
    }
    .day-name {
      font-family: var(--font-head);
      font-size: 1.3rem;
      color: var(--text);
      letter-spacing: 0.06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Exercise List */
    .exercise-list { padding: 0.5rem 0; min-height: 40px; }
    .exercise-item {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .exercise-item:last-child { border-bottom: none; }
    .exercise-item:hover { background: rgba(255,255,255,0.02); }

    .exercise-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.3rem;
    }

    .exercise-check {
      appearance: none;
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      border: 2px solid var(--border-bright);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      border-radius: 4px;
      transition: all 0.12s;
    }
    .exercise-check:checked { background: var(--green); border-color: var(--green); }
    .exercise-check:checked::after {
      content: '✓';
      position: absolute;
      top: -1px; left: 2px;
      font-size: 11px;
      color: #000;
      font-weight: 900;
    }

    .exercise-name {
      font-size: 0.875rem;
      font-weight: 600;
      flex: 1;
      color: var(--text);
      transition: all 0.15s;
    }
    .exercise-item.done .exercise-name {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    .exercise-pr-badge {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--orange);
      background: rgba(249,115,22,0.12);
      border: 1px solid rgba(249,115,22,0.35);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      letter-spacing: 0.06em;
    }

    .exercise-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-left: 1.5rem;
      margin-bottom: 0.4rem;
    }

    /* Set Rows */
    .set-list { margin-left: 1.5rem; display: flex; flex-direction: column; gap: 0.25rem; margin-top: 0.25rem; }
    .set-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; }
    .set-num { font-size: 0.62rem; font-weight: 700; color: var(--text-dim); width: 1.6rem; flex-shrink: 0; letter-spacing: 0.04em; }
    .set-data { color: var(--text-muted); flex: 1; }
    .set-data .weight { font-weight: 700; color: var(--text); }
    .set-data .reps   { color: var(--text-muted); }

    .set-check {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--border-bright);
      background: transparent;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      border-radius: 3px;
      transition: all 0.12s;
    }
    .set-check:checked { background: var(--green); border-color: var(--green); }
    .set-check:checked::after {
      content: '✓';
      position: absolute;
      top: -2px; left: 1px;
      font-size: 10px;
      color: #000;
      font-weight: 900;
    }

    .btn-log-set {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid var(--accent-dim);
      padding: 0.15rem 0.5rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.12s;
    }
    .btn-log-set:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .exercise-progress { height: 3px; background: var(--border); margin: 0.5rem 0 0 1.5rem; border-radius: 2px; overflow: hidden; }
    .exercise-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); transition: width 0.3s ease; }

    /* Card Footer */
    .day-card-footer {
      padding: 0.6rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      background: var(--bg-card-alt);
    }
    .day-progress-text { font-size: 0.7rem; font-weight: 500; color: var(--text-muted); }

    /* Buttons */
    .btn-primary {
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.5rem 1.2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.15s;
    }
    .btn-primary:hover { background: #6aa3ff; box-shadow: 0 0 18px var(--accent-glow); }

    .btn-ghost {
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      background: none;
      color: var(--text-muted);
      border: 1px solid var(--border-bright);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.12s;
    }
    .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }

    .btn-reset {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      background: none;
      border: 1px solid var(--border);
      cursor: pointer;
      letter-spacing: 0.06em;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      text-transform: uppercase;
      transition: all 0.12s;
    }
    .btn-reset:hover { border-color: var(--red); color: var(--red); background: rgba(239,68,68,0.08); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5,7,12,0.8);
      backdrop-filter: blur(4px);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 440px;
      animation: modalIn 0.18s ease;
      overflow: hidden;
    }
    .modal-sm { max-width: 320px; }
    @keyframes modalIn {
      from { transform: translateY(-10px) scale(0.97); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }
    .modal-header {
      background: var(--bg-card-alt);
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .modal-title { font-family: var(--font-head); font-size: 1.1rem; color: var(--text); letter-spacing: 0.08em; }
    .modal-close { font-size: 1.2rem; line-height: 1; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.1rem 0.3rem; transition: color 0.12s; border-radius: 4px; }
    .modal-close:hover { color: var(--red); background: rgba(239,68,68,0.1); }
    .modal-body { padding: 1.25rem 1rem; }
    .modal-footer { padding: 0.75rem 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; justify-content: flex-end; background: var(--bg-card-alt); }

    /* Forms */
    .form-label { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.4rem; }
    .form-input {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--border-bright);
      background: var(--bg);
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      outline: none;
      border-radius: var(--radius-sm);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .log-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* PR Board */
    .pr-board { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-card); }
    .pr-board-header {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 1rem;
      padding: 0.6rem 1.1rem;
      background: var(--bg-card-alt);
      border-bottom: 1px solid var(--border);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .pr-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 1rem; align-items: center; padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--border); transition: background 0.1s; }
    .pr-row:hover { background: rgba(255,255,255,0.02); }
    .pr-row:last-child { border-bottom: none; }
    .pr-exercise { font-weight: 700; font-size: 0.875rem; color: var(--text); }
    .pr-day { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }
    .pr-value { font-size: 0.85rem; text-align: right; }
    .pr-date { font-size: 0.68rem; color: var(--text-muted); text-align: right; white-space: nowrap; }
    .pr-value .w { font-weight: 700; color: var(--text); }
    .pr-value .r { color: var(--text-muted); font-size: 0.75rem; }
    .pr-new-badge { font-size: 0.58rem; font-weight: 800; color: var(--green); background: var(--green-glow); border: 1px solid rgba(34,197,94,0.3); padding: 0.05rem 0.3rem; border-radius: 4px; letter-spacing: 0.06em; vertical-align: middle; margin-left: 0.35rem; }

    /* Toast */
    .pr-toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--green);
      color: var(--green);
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.75rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 20px var(--green-glow);
      border-radius: var(--radius);
      transform: translateY(120%);
      transition: transform 0.3s ease;
      z-index: 600;
      pointer-events: none;
    }
    .pr-toast.show { transform: translateY(0); }

    /* Empty State */
    .empty-state { text-align: center; padding: 3rem 1rem; }
    .empty-icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .empty-text { color: var(--text-muted); line-height: 1.7; font-size: 0.95rem; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    @media (max-width: 600px) {
      .logo-title { font-size: 1.35rem; }
      .header-inner { gap: 0.5rem; }
      .nav-btn { font-size: 0.7rem; padding: 0.35rem 0.65rem; }
      .days-grid { grid-template-columns: 1fr; }
      .pr-board-header, .pr-row { grid-template-columns: 1fr auto; }
      .pr-day, .pr-date { display: none; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-logo">
        <span class="logo-icon">&#9889;</span>
        <div>
          <h1 class="logo-title">Workout<span>Lock</span></h1>
          <p class="logo-subtitle">Training Tracker</p>
        </div>
      </div>
      <nav class="header-nav">
        <button class="nav-btn active" data-view="split">Weekly Split</button>
        <button class="nav-btn" data-view="prs">PR Board</button>
      </nav>
    </div>
  </header>

  <main class="main-container">

    <section id="view-split" class="view active">
      <div class="section-header">
        <h2 class="section-title">Weekly Training Split</h2>
        <span class="stamp">4-Week Program</span>
      </div>
      <div class="days-grid" id="days-grid"></div>
      <div class="empty-state" id="split-empty" style="display:none;">
        <p class="empty-icon">📋</p>
        <p class="empty-text">Program not loaded.</p>
      </div>
    </section>

    <section id="view-prs" class="view">
      <div class="section-header">
        <h2 class="section-title">Personal Records</h2>
        <span class="stamp">Official Log</span>
      </div>
      <div class="pr-board" id="pr-board"></div>
      <div class="empty-state" id="pr-empty">
        <p class="empty-icon">🏆</p>
        <p class="empty-text">No PRs recorded yet.<br>Log a lift to start tracking records.</p>
      </div>
    </section>

  </main>

  <!-- Log Set Modal -->
  <div class="modal-overlay" id="modal-logset">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 class="modal-title" id="logset-title">Log Set</h3>
        <button class="modal-close" data-close="modal-logset">&times;</button>
      </div>
      <div class="modal-body">
        <div class="log-row">
          <div>
            <label class="form-label">Weight (lbs)</label>
            <input class="form-input" type="number" id="logset-weight" min="0" step="2.5" />
          </div>
          <div>
            <label class="form-label">Reps</label>
            <input class="form-input" type="number" id="logset-reps" min="1" max="999" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" data-close="modal-logset">Cancel</button>
        <button class="btn-primary" id="save-logset-btn">Log Set</button>
      </div>
    </div>
  </div>

  <!-- PR Toast -->
  <div class="pr-toast" id="pr-toast">
    <span>🏆</span>
    <span id="pr-toast-msg">New PR!</span>
  </div>

  <script>
    'use strict';

    const PROGRAM = [
      {
        name: 'Chest', weekday: 'Monday',
        exercises: [
          { name: 'Incline Barbell Press',         sets: 4, reps: 6  },
          { name: 'Flat Dumbbell Press',            sets: 3, reps: 8  },
          { name: 'Cable Crossovers (High to Low)', sets: 3, reps: 12 },
          { name: 'Dips (Chest Variation)',         sets: 3, reps: 8  },
        ],
      },
      {
        name: 'Back', weekday: 'Tuesday',
        exercises: [
          { name: 'Weighted Pull-ups (Wide Grip)',        sets: 4, reps: 6  },
          { name: 'Heavy Barbell Rows (Underhand Grip)',  sets: 3, reps: 6  },
          { name: 'Lat Pulldowns (Close Neutral Grip)',   sets: 3, reps: 10 },
          { name: 'Cable Rows (Wide Grip)',               sets: 3, reps: 12 },
        ],
      },
      {
        name: 'Legs', weekday: 'Wednesday',
        exercises: [
          { name: 'Barbell Back Squats',  sets: 4, reps: 6  },
          { name: 'Romanian Deadlifts',   sets: 3, reps: 8  },
          { name: 'Leg Press',            sets: 3, reps: 10 },
          { name: 'Leg Extensions',       sets: 3, reps: 12 },
          { name: 'Leg Curls',            sets: 3, reps: 12 },
          { name: 'Standing Calf Raises', sets: 4, reps: 12 },
        ],
      },
      { name: 'Rest', weekday: 'Thursday', exercises: [] },
      {
        name: 'Shoulders', weekday: 'Friday',
        exercises: [
          { name: 'Seated Dumbbell Shoulder Press',          sets: 3, reps: 6  },
          { name: 'Cross-Body Cable Y-Raises (Side Delts)',  sets: 4, reps: 10 },
          { name: 'Super-ROM Dumbbell Lateral Raises',       sets: 3, reps: 20 },
          { name: 'Reverse Pec Deck (Rear Delts)',           sets: 3, reps: 10 },
        ],
      },
      {
        name: 'Triceps', weekday: 'Saturday',
        exercises: [
          { name: 'EZ Bar Overhead Tricep Extensions',             sets: 4, reps: 10 },
          { name: 'Barbell Skull Crushers',                        sets: 3, reps: 8  },
          { name: 'Cable Pushdowns (Rope Attachment)',              sets: 3, reps: 10 },
          { name: 'Overhead Cable Tricep Extensions (Single Arm)', sets: 2, reps: 12 },
        ],
      },
      {
        name: 'Biceps', weekday: 'Sunday',
        exercises: [
          { name: 'Bayesian Cable Curls',         sets: 4, reps: 10 },
          { name: 'Machine Preacher Curls',        sets: 3, reps: 8  },
          { name: 'Heavy Barbell / EZ-Bar Curls',  sets: 3, reps: 6  },
          { name: 'Incline Dumbbell Curls',        sets: 3, reps: 10 },
        ],
      },
    ];

    let state = { days: [], prs: {}, loggingSet: null };

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    function save() {
      localStorage.setItem('wl_state', JSON.stringify({ days: state.days, prs: state.prs }));
    }

    function load() {
      try {
        const raw = localStorage.getItem('wl_state');
        if (raw) { const p = JSON.parse(raw); state.days = p.days || []; state.prs = p.prs || {}; }
      } catch(e) {}
      if (state.days.length === 0) {
        state.days = PROGRAM.map(day => ({
          id: uid(), name: day.name, weekday: day.weekday,
          exercises: day.exercises.map(def => ({
            id: uid(), name: def.name, targetReps: def.reps, targetWeight: 0,
            sets: Array.from({ length: def.sets }, () => ({ weight: 0, reps: def.reps, completed: false })),
          })),
        }));
        save();
      }
    }

    function checkPR(exerciseName, weight, reps, dayName) {
      const key = exerciseName.toLowerCase();
      const existing = state.prs[key];
      const isNew = !existing || weight > existing.weight || (weight === existing.weight && reps > existing.reps);
      if (isNew && (weight > 0 || reps > 0)) {
        state.prs[key] = {
          exercise: exerciseName, weight, reps, dayName, isNew: true,
          date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        };
        save();
        showPRToast(exerciseName, weight, reps);
      }
    }

    let toastTimer;
    function showPRToast(name, weight, reps) {
      const toast = document.getElementById('pr-toast');
      document.getElementById('pr-toast-msg').textContent = `NEW PR — ${name}: ${weight} lbs × ${reps}`;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function esc(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderDays() {
      const grid = document.getElementById('days-grid');
      const empty = document.getElementById('split-empty');
      if (state.days.length === 0) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      grid.innerHTML = state.days.map(day => renderDayCard(day)).join('');
      attachDayListeners();
    }

    function renderDayCard(day) {
      const totalSets     = day.exercises.reduce((s, e) => s + e.sets.length, 0);
      const completedSets = day.exercises.reduce((s, e) => s + e.sets.filter(st => st.completed).length, 0);
      const pct = totalSets ? Math.round((completedSets / totalSets) * 100) : 0;
      const isRest = day.exercises.length === 0;

      return `
      <div class="day-card" data-day-id="${day.id}">
        <div class="day-card-header">
          <div class="day-card-title-group">
            <div class="day-weekday">${esc(day.weekday || '')}</div>
            <div class="day-name">${esc(day.name)}</div>
          </div>
        </div>
        <div class="exercise-list" data-day-id="${day.id}">
          ${isRest
            ? '<p style="font-size:0.85rem;color:var(--text-muted);padding:1rem 1rem;font-style:italic;text-align:center;">Active recovery — light cardio, mobility, or full rest.</p>'
            : day.exercises.map(ex => renderExerciseItem(day.id, ex)).join('')}
        </div>
        ${!isRest ? `
        <div class="day-card-footer">
          <span class="day-progress-text">
            ${totalSets > 0 ? `${completedSets}/${totalSets} sets — ${pct}%` : 'No sets logged'}
          </span>
          <div style="display:flex;gap:0.4rem;align-items:center;">
            ${totalSets > 0 ? `<button class="btn-reset" data-action="reset-day" data-day-id="${day.id}">Reset</button>` : ''}
          </div>
        </div>` : ''}
      </div>`;
    }

    function renderExerciseItem(dayId, ex) {
      const completedSets = ex.sets.filter(s => s.completed).length;
      const totalSets     = ex.sets.length;
      const pct           = totalSets ? (completedSets / totalSets) * 100 : 0;
      const allDone       = totalSets > 0 && completedSets === totalSets;
      const pr            = state.prs[ex.name.toLowerCase()];

      const setsHTML = ex.sets.map((set, i) => `
        <div class="set-row">
          <span class="set-num">S${i+1}</span>
          <span class="set-data">
            <span class="weight">${set.weight > 0 ? set.weight + ' lbs' : 'BW'}</span>
            <span class="reps"> × ${set.reps}</span>
          </span>
          <button class="btn-log-set" data-action="log-set" data-day-id="${dayId}" data-ex-id="${ex.id}" data-set-idx="${i}">Edit</button>
          <input type="checkbox" class="set-check" data-action="toggle-set" data-day-id="${dayId}" data-ex-id="${ex.id}" data-set-idx="${i}" ${set.completed ? 'checked' : ''} />
        </div>`).join('');

      return `
      <div class="exercise-item${allDone ? ' done' : ''}" data-ex-id="${ex.id}">
        <div class="exercise-header">
          <input type="checkbox" class="exercise-check" data-action="toggle-exercise" data-day-id="${dayId}" data-ex-id="${ex.id}" ${allDone ? 'checked' : ''} />
          <span class="exercise-name">${esc(ex.name)}</span>
          ${pr ? `<span class="exercise-pr-badge" title="PR: ${pr.weight}lbs × ${pr.reps}">PR</span>` : ''}
        </div>
        <div class="exercise-meta">${totalSets} set${totalSets !== 1 ? 's' : ''} · target ${ex.targetReps} reps · ${ex.targetWeight > 0 ? ex.targetWeight + ' lbs' : 'BW'}</div>
        <div class="set-list">${setsHTML}</div>
        <div class="exercise-progress"><div class="exercise-progress-fill" style="width:${pct}%"></div></div>
      </div>`;
    }

    function renderPRs() {
      const board = document.getElementById('pr-board');
      const empty = document.getElementById('pr-empty');
      const entries = Object.values(state.prs);
      if (entries.length === 0) { board.innerHTML = ''; empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      entries.sort((a, b) => a.exercise.localeCompare(b.exercise));
      board.innerHTML = `
        <div class="pr-board-header"><span>Exercise</span><span>Weight</span><span>Reps</span><span>Date</span></div>` +
        entries.map(pr => `
        <div class="pr-row">
          <div>
            <div class="pr-exercise">${esc(pr.exercise)}${pr.isNew ? '<span class="pr-new-badge">NEW</span>' : ''}</div>
            <div class="pr-day">${esc(pr.dayName || '')}</div>
          </div>
          <div class="pr-value"><span class="w">${pr.weight > 0 ? pr.weight + ' lbs' : 'BW'}</span></div>
          <div class="pr-value"><span class="r">${pr.reps} reps</span></div>
          <div class="pr-date">${pr.date}</div>
        </div>`).join('');
    }

    function setupNav() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const view = btn.dataset.view;
          document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
          document.getElementById(`view-${view}`).classList.add('active');
          if (view === 'prs') renderPRs();
        });
      });
    }

    function openModal(id)  { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    function setupModalClose() {
      document.querySelectorAll('[data-close]').forEach(el => {
        el.addEventListener('click', () => closeModal(el.dataset.close));
      });
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(overlay.id); });
      });
    }

    document.getElementById('save-logset-btn').addEventListener('click', () => {
      if (!state.loggingSet) return;
      const { dayId, exerciseId, setIndex } = state.loggingSet;
      const weight = parseFloat(document.getElementById('logset-weight').value) || 0;
      const reps   = parseInt(document.getElementById('logset-reps').value) || 0;
      const day = state.days.find(d => d.id === dayId); if (!day) return;
      const ex  = day.exercises.find(e => e.id === exerciseId); if (!ex) return;
      ex.sets[setIndex].weight = weight;
      ex.sets[setIndex].reps   = reps;
      ex.sets[setIndex].completed = true;
      checkPR(ex.name, weight, reps, day.name);
      save(); renderDays(); closeModal('modal-logset');
    });

    function attachDayListeners() {
      const grid = document.getElementById('days-grid');
      grid.replaceWith(grid.cloneNode(true));
      const newGrid = document.getElementById('days-grid');
      newGrid.addEventListener('click', handleDayGridClick);
      newGrid.addEventListener('change', handleDayGridChange);
    }

    function handleDayGridClick(e) {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const { action, dayId, exId, setIdx } = btn.dataset;
      if (action === 'log-set') {
        const day = state.days.find(d => d.id === dayId); if (!day) return;
        const ex  = day.exercises.find(e => e.id === exId); if (!ex) return;
        const idx = parseInt(setIdx);
        const set = ex.sets[idx];
        state.loggingSet = { dayId, exerciseId: exId, setIndex: idx };
        document.getElementById('logset-title').textContent = `Log Set — ${ex.name}`;
        document.getElementById('logset-weight').value = set.weight;
        document.getElementById('logset-reps').value   = set.reps;
        openModal('modal-logset');
        setTimeout(() => document.getElementById('logset-weight').focus(), 50);
      } else if (action === 'reset-day') {
        const day = state.days.find(d => d.id === dayId);
        if (!day || !confirm(`Reset all sets for "${day.name}"?`)) return;
        day.exercises.forEach(ex => ex.sets.forEach(s => s.completed = false));
        save(); renderDays();
      }
    }

    function handleDayGridChange(e) {
      const el = e.target;
      if (!el.dataset.action) return;
      const { action, dayId, exId, setIdx } = el.dataset;
      if (action === 'toggle-set') {
        const day = state.days.find(d => d.id === dayId); if (!day) return;
        const ex  = day.exercises.find(e => e.id === exId); if (!ex) return;
        ex.sets[parseInt(setIdx)].completed = el.checked;
        save(); renderDays();
      } else if (action === 'toggle-exercise') {
        const day = state.days.find(d => d.id === dayId); if (!day) return;
        const ex  = day.exercises.find(e => e.id === exId); if (!ex) return;
        ex.sets.forEach(s => s.completed = el.checked);
        save(); renderDays();
      }
    }

    document.getElementById('logset-reps').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('save-logset-btn').click();
    });

    (function init() {
      load();
      setupNav();
      setupModalClose();
      renderDays();
    })();
  </script>
</body>
</html>
